[package]
name = "rustysynth"
version = "1.3.7"
authors = ["Nobuaki Tanaka"]
edition = "2021"

description = "A SoundFont MIDI synthesizer written in pure Rust"
documentation = "https://docs.rs/rustysynth/latest/rustysynth/"
readme = "README.md"
repository = "https://github.com/sinshu/rustysynth"
license = "MIT"
keywords = ["soundfont", "midi", "synthesizer", "audio", "music"]
categories = ["multimedia::audio"]

[features]
default = []
# SF3 (Ogg Vorbis compressed sample data) decode. Optional so the default build
# stays dependency-free for consumers that only ship SF2.
sf3 = ["dep:lewton"]

[dependencies]
lewton = { version = "0.10", optional = true }
